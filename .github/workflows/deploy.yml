name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/configure-pages and actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # The CV PDFs are committed artifacts, regenerated locally with
      # `npm run build:cv`. They are not rebuilt here on purpose: that step
      # needs a browser, and rebuilding would overwrite reviewed output.
      - name: Build the site
        run: npm run build

      - name: Enable and configure Pages
        # `enablement: true` lets the workflow switch Pages to the GitHub
        # Actions source itself, so a fresh repository needs no manual setup.
        # It requires the repository to allow it — if it fails with a 404 here,
        # set Settings → Pages → Source to "GitHub Actions" by hand.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4